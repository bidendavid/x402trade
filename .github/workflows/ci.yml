name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test order-engine
        run: npx jest --config services/order-engine/jest.config.js

      - name: Test x402-gateway
        run: npx jest --config services/x402-gateway/jest.config.js

      - name: Test risk-control
        run: npx jest --config services/risk-control/jest.config.js

      - name: Test contracts (Hardhat)
        run: npm test -w contracts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build x402-gateway
        run: npm run build -w services/x402-gateway

      - name: Build order-engine
        run: npm run build -w services/order-engine

      - name: Build wallet-service
        run: npm run build -w services/wallet-service

      - name: Build oracle-service
        run: npm run build -w services/oracle-service

      - name: Build risk-control
        run: npm run build -w services/risk-control

      - name: Build indexer-service
        run: npm run build -w services/indexer-service

      - name: Compile contracts
        run: npm run compile -w contracts

  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile -w contracts

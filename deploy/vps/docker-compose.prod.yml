# Single-server production deployment
# Works on any VPS: DigitalOcean, Hetzner, Vultr, Linode, AWS EC2
# Minimum: 4 GB RAM, 2 vCPU
#
# Setup:
#   1. Install Docker + Docker Compose on the server
#   2. Copy .env.example to .env and fill in all values
#   3. Run SSL setup: ./ssl-setup.sh getx402.trade your@email.com
#   4. docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agent_exchange
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_exchange"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:alpine
    command: "-js -m 8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  order-engine:
    image: ghcr.io/${GITHUB_REPO}/order-engine:latest
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://nats:4222
      DB_URL: postgresql://agent:${DB_PASSWORD}@postgres:5432/agent_exchange
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    restart: unless-stopped

  wallet-service:
    image: ghcr.io/${GITHUB_REPO}/wallet-service:latest
    environment:
      WALLET_PORT: 8082
      DB_URL: postgresql://agent:${DB_PASSWORD}@postgres:5432/agent_exchange
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://nats:4222
      PLATFORM_FEE_WALLET: ${PLATFORM_FEE_WALLET}
      USDC_CONTRACT: ${USDC_CONTRACT}
      BASE_RPC_URL: ${BASE_RPC_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    restart: unless-stopped

  background-worker:
    image: ghcr.io/${GITHUB_REPO}/background-worker:latest
    environment:
      BACKGROUND_PORT: 8083
      DB_URL: postgresql://agent:${DB_PASSWORD}@postgres:5432/agent_exchange
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://nats:4222
      BASE_RPC_URL: ${BASE_RPC_URL}
      AGENT_EXCHANGE_CORE_ADDRESS: ${AGENT_EXCHANGE_CORE_ADDRESS:-}
      AGENT_WALLET_ADDRESS: ${AGENT_WALLET_ADDRESS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  x402-gateway:
    image: ghcr.io/${GITHUB_REPO}/x402-gateway:latest
    environment:
      PORT: 8080
      DB_URL: postgresql://agent:${DB_PASSWORD}@postgres:5432/agent_exchange
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://nats:4222
      RISK_CONTROL_URL: http://background-worker:8083
      DEPOSIT_ADDRESS: ${DEPOSIT_ADDRESS}
      PLATFORM_FEE_WALLET: ${PLATFORM_FEE_WALLET}
      USDC_CONTRACT: ${USDC_CONTRACT}
    depends_on:
      postgres:          { condition: service_healthy }
      redis:             { condition: service_healthy }
      nats:              { condition: service_healthy }
      background-worker: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      x402-gateway: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

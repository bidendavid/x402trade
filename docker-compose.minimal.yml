# ──────────────────────────────────────────────────────────────────────────────
# x402Trade — Single-VPS minimal deployment
#
# Target hardware : Hetzner CX21 (2 vCPU, 4 GB RAM) ≈ €5.83/mo
#                   DigitalOcean Basic (1 vCPU, 2 GB RAM) ≈ $6/mo
#                   Fly.io (shared-cpu-1x, 512 MB)        ≈ $5-8/mo
#
# Services (4 instead of 6):
#   x402-gateway       — public API + WebSocket
#   order-engine       — matching engine (NATS only, no HTTP)
#   wallet-service     — balance ledger
#   background-worker  — oracle + risk-control + indexer (merged)
#
# Infrastructure:
#   postgres  — single instance, 256 MB RAM limit
#   redis     — single instance, 128 MB RAM limit
#   nats      — single instance, no JetStream persistence to disk
#
# No monitoring stack (Prometheus/Grafana) — use external free tier if needed.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agent_exchange
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_exchange"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:alpine
    command: "-js"
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  order-engine:
    build:
      context: .
      dockerfile: services/order-engine/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      DB_URL: postgresql://agent:agentpass@postgres:5432/agent_exchange
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    restart: unless-stopped

  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    environment:
      WALLET_PORT: 8082
      DB_URL: postgresql://agent:agentpass@postgres:5432/agent_exchange
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      PLATFORM_FEE_WALLET: ${PLATFORM_FEE_WALLET:-}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    restart: unless-stopped

  background-worker:
    build:
      context: .
      dockerfile: services/background-worker/Dockerfile
    environment:
      BACKGROUND_PORT: 8083
      REDIS_URL: redis://redis:6379
      DB_URL: postgresql://agent:agentpass@postgres:5432/agent_exchange
      NATS_URL: nats://nats:4222
      BASE_RPC_URL: https://mainnet.base.org
      ORACLE_POLL_INTERVAL_MS: "30000"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  x402-gateway:
    build:
      context: .
      dockerfile: services/x402-gateway/Dockerfile
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      DB_URL: postgresql://agent:agentpass@postgres:5432/agent_exchange
      NATS_URL: nats://nats:4222
      RISK_CONTROL_URL: http://background-worker:8083
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:          { condition: service_healthy }
      redis:             { condition: service_healthy }
      nats:              { condition: service_healthy }
      background-worker: { condition: service_healthy }
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

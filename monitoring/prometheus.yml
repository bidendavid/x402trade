global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: x402-gateway
    static_configs:
      - targets: ['x402-gateway:8080']
    metrics_path: /metrics

  - job_name: wallet-service
    static_configs:
      - targets: ['wallet-service:8082']
    metrics_path: /metrics

  - job_name: oracle-service
    static_configs:
      - targets: ['oracle-service:8083']
    metrics_path: /metrics

  - job_name: risk-control
    static_configs:
      - targets: ['risk-control:8084']
    metrics_path: /metrics

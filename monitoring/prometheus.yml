global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: x402-gateway
    static_configs:
      - targets: ['104.238.164.95:8080']
    metrics_path: /metrics

  - job_name: wallet-service
    static_configs:
      - targets: ['104.238.164.95:8082']
    metrics_path: /metrics

  - job_name: background-worker
    static_configs:
      - targets: ['104.238.164.95:8083']
    metrics_path: /metrics

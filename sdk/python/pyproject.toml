[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x402trade-sdk"
version = "1.0.0"
description = "Python SDK for x402Trade — AI-native trading exchange on Base L2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["x402trade", "trading", "ai-agent", "base", "usdc", "defi", "ethereum"]
dependencies = [
    "httpx>=0.27.0",
    "eth-account>=0.11.0",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://getx402.trade"
Repository = "https://github.com/bidendavid/x402trade"
